# Monitor mode is read-only. It may collect public market data and, when
# credentials are configured, read-only account snapshots. It must not create
# order intents or submit orders.

mode: monitor

exchange:
  name: bybit
  environment: demo
  readonly: true

symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

market_data:
  max_tick_age_ms: 1500
  max_orderbook_age_ms: 1500
  max_funding_age_ms: 60000
  max_latency_ms: 750

strategy:
  funding_arbitrage:
    enabled: true
    min_net_edge_bps: 8
    min_funding_rate_bps: 5
    min_seconds_to_funding: 900
    max_seconds_to_funding: 25200

kill_switch:
  enabled: true
  mode: simulated
  require_manual_reset: true

agent:
  enabled: true
  read_sources:
    - audit_events
    - reporting_views
  can_modify_config: false
  can_access_execution: false

persistence:
  backend: postgresql

logging:
  level: INFO
  format: json
